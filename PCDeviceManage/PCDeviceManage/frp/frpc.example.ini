; frpc 配置示例（frp 0.39.x，ini 格式；frp 0.52 及以上版本改用 TOML）。
; 复制为同目录下的 frpc.ini 再修改。frpc.ini 已加入 .gitignore，服务器地址和令牌不会被提交。

[common]
server_addr = frps.example.com
server_port = 7000
; frps.ini 的 [common] 中也要配置相同的 authentication_method 和 token，否则任何人都能使用你的 frps。
authentication_method = token
token = change-me-to-a-long-random-string

; 方式一：TCP 映射。简单，但浏览器到 frps 之间是明文 HTTP，访问令牌和会话 Cookie 可能被窃听。
[pcmanage]
type = tcp
local_ip = 127.0.0.1
local_port = 9527
remote_port = 9999

; 方式二（推荐）：HTTPS 访问。需要 frps 配置 vhost_https_port，并为域名准备证书。
; 使用时删掉上面的 [pcmanage]，取消下面的注释。
; 不要配置 plugin_host_header_rewrite：服务端会用 Host 校验请求来源。
;[pcmanage]
;type = https
;custom_domains = pc.example.com
;plugin = https2http
;plugin_local_addr = 127.0.0.1:9527
;plugin_crt_path = ./server.crt
;plugin_key_path = ./server.key
;plugin_header_X-Forwarded-Proto = https

; 只是自己用的话，更推荐 Tailscale / ZeroTier 这类组网工具，完全不把端口暴露到公网。
